<!DOCTYPE html>
<html>
<head>
<title>Nexo Rooms</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:black;
}

img{
    width:100%;
    height:auto;
    display:block;
}

.desktop{
    display:block;
}

.mobile{
    display:none;
}

@media only screen and (max-width: 768px){

.desktop{
    display:none;
}

.mobile{
    display:block;
}

}
</style>
</head>

<body>

<img class="desktop" src="WEB NEXO.png">

<img class="mobile" src="son web.png">

</body>
</html>
